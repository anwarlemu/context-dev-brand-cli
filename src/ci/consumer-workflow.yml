name: {{name}}
on: [pull_request]
jobs:
  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: {{cli}} check
      - name: Review changed pages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx playwright install chromium
          for page in $(git diff --name-only origin/${{ github.base_ref }}... | grep -E '(^|/)app/.*page\.tsx$'); do
            {{cli}} review "$page" --threshold 7
          done
